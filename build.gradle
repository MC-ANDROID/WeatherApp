buildscript {
    ext {
        compose_version = '1.9.1'
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false// this version matches your Kotlin version
    id 'com.google.devtools.ksp' version '2.2.20-2.0.3' apply false // KSP plugin for Kotlin 2.2.20

}

task clean(type: Delete) {
    delete rootProject.buildDir
}